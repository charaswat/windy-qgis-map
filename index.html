<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy QGIS Map</title>
    
    <!-- Leaflet & Windy SDK Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/lib/tomtom.min.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/lib/windySdk.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/lib/windyInit.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        html, body, #windy {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
		/ * ทำให้แผนที่และเลเยอร์ภายในโปร่งใสและปรับความสว่างได้ตามตัวแปร ควบคุมด้วย CSS Filter */
        .leaflet-container {
            background: transparent !important;
        }

        #windy {
            opacity: var(--windy-opacity, 0.8);
            filter: brightness(var(--windy-brightness, 1));
            transition: opacity 0.1s ease, filter 0.1s ease;
        }
        /* Modern Floating Control Glassmorphism */
        .glass-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 220px;
        }

        .panel-header {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 11px;
            color: #94a3b8;
			display: flex;
            justify-content: space-between;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="windy"></div>

    <!-- แผงควบคุมความโปร่งใสและความสว่าง -->
    <div class="glass-panel">
        <div class="panel-header">
            <span>Windy Live Stream</span>
            <span style="font-size: 9px; background: #0284c7; padding: 2px 6px; border-radius: 8px;">QGIS</span>
        </div>
        
        <!-- สไลเดอร์ปรับความโปร่งใส (Opacity) -->
        <div class="control-group">
            <label for="opacitySlider">
                <span>ความทึบ (Opacity):</span> 
                <span id="opacityVal">80%</span>
            </label>
            <input type="range" min="0" max="100" value="80" class="slider" id="opacitySlider">
        </div>

        <!-- สไลเดอร์ปรับความสว่าง (Brightness) -->
        <div class="control-group">
            <label for="brightnessSlider">
                <span>ความสว่าง (Brightness):</span> 
                <span id="brightnessVal">100%</span>
            </label>
            <input type="range" min="20" max="200" value="100" class="slider" id="brightnessSlider">
        </div>
    </div>
    <script>
        // ประกาศตัวแปร map ไว้เป็น Global เพื่อให้ QGIS เรียกใช้งานผ่าน runJavaScript ได้
        let map;

        const WINDY_API_KEY = 'DrtpLWqg4AIIp4Mfo9IYsAI84TQLGtsd';
        
        const options = {
            key: WINDY_API_KEY,
            lat: 13.75,
            lon: 100.50,
            zoom: 6,
            overlay: 'wind'
        };

        // เรียกใช้งานเมื่อ API โหลดพร้อมแล้ว
        windyInit(options, windyAPI => {
            // ดึงค่า map ออกมาจาก windyAPI แล้วเก็บใส่ตัวแปร global map
            map = windyAPI.map;
            console.log("Windy Loaded Successfully!");

            L.popup()
                .setLatLng([18.788, 98.985])
                .setContent('Windy API Ready!')
                .openOn(map);


            // ตัวแปรควบคุมองค์ประกอบ HTML
            const windyContainer = document.getElementById('windy');
            
            const opacitySlider = document.getElementById('opacitySlider');
            const opacityVal = document.getElementById('opacityVal');
            
            const brightnessSlider = document.getElementById('brightnessSlider');
            const brightnessVal = document.getElementById('brightnessVal');

            // ฟังก์ชันอัปเดตค่าความโปร่งใส
            opacitySlider.addEventListener('input', (e) => {
                const val = e.target.value;
                opacityVal.innerText = `${val}%`;
                windyContainer.style.setProperty('--windy-opacity', val / 100);
            });

            // ฟังก์ชันอัปเดตค่าความสว่าง
            brightnessSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                brightnessVal.innerText = `${val}%`;
                windyContainer.style.setProperty('--windy-brightness', val / 100);
            });
		});
    </script>
</body>
</html>
