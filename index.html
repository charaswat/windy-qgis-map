<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Level Weather Radar Dashboard (28 Maps)</title>
	<!-- ไอคอนเว็บ (Favicon) แบบสำเร็จรูปรูปสภาพอากาศ -->
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>">

    <!-- Windy API Library -->
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/lib/iframe.js"></script>

    <style>
        :root {
            --windy-opacity: 1;
            --windy-brightness: 1;
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #0284c7;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        /* 🎛️ Header & Master Controls */
        header {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 999;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .controls-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .control-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #30363d;
            outline: none;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        /* 🔘 Navigation Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        /* 🗺️ Grid & Map Cards Layout */
        .level-section {
            margin-bottom: 35px;
        }

        .level-header {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--accent-color);
            color: #e2e8f0;
        }

        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .map-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .map-card-header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .tag {
            background: #1e293b;
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .tag.surface-fallback {
            background: #854d0e;
            color: #fef08a;
        }

        /* Container สั่งการความโปร่งใส/ความสว่างให้ Windy Map */
        .windy-container {
            width: 100%;
            height: 280px;
            position: relative;
            opacity: var(--windy-opacity);
            filter: brightness(var(--windy-brightness));
            transition: opacity 0.1s ease, filter 0.1s ease;
        }
    </style>
</head>
<body>

    <!-- 🎛️ Master Control Panel -->
    <header>
        <div class="header-title">
            <h1>🌐 Multi-Level Weather Dashboard (28 Maps)</h1>
            <span style="font-size: 0.85rem; color: var(--text-sub);">Windy API Dashboard</span>
        </div>
        <div class="controls-wrapper">
            <div class="control-card">
                <div class="control-label">
                    <span>ความโปร่งใสแผนที่ (Opacity)</span>
                    <span id="masterOpacityVal" style="color: #38bdf8;">100%</span>
                </div>
                <input type="range" min="0" max="100" value="100" class="slider" id="masterOpacitySlider">
            </div>
            <div class="control-card">
                <div class="control-label">
                    <span>ความสว่างแผนที่ (Brightness)</span>
                    <span id="masterBrightVal" style="color: #38bdf8;">100%</span>
                </div>
                <input type="range" min="0" max="100" value="100" class="slider" id="masterBrightSlider">
            </div>
        </div>
    </header>

    <!-- 🔘 Pressure Level Filter Tabs -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="filterLevel('all')">ทั้งหมด (28 แผนที่)</button>
        <button class="tab-btn" onclick="filterLevel('850h')">850 hPa (~1.5 km)</button>
        <button class="tab-btn" onclick="filterLevel('925h')">925 hPa (~750 m)</button>
        <button class="tab-btn" onclick="filterLevel('500h')">500 hPa (~5.5 km)</button>
        <button class="tab-btn" onclick="filterLevel('200h')">200 hPa (~12 km)</button>
    </div>

    <!-- 🗺️ Dashboard Container -->
    <main id="dashboardContainer"></main>

    <!-- เชื่อมต่อกับไฟล์ JavaScript -->
    <script src="script.js"></script>
</body>
</html>
