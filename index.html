<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Windy QGIS Map</title>
    <!-- โหลดเฉพาะ Leaflet JS และ Windy LibBoot ตามกฎ (ห้ามใส่ Leaflet CSS เด็ดขาด) -->
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js/beta=36"></script>  

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ตั้งค่าพื้นหลังเว็บให้โปร่งใส เพื่อมองทะลุเห็นแผนที่ QGIS ด้านล่าง */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        #windy {
            width: 100%;
            height: 100%;
            background: transparent !important;
            opacity: var(--windy-opacity, 0.8);
            filter: brightness(var(--windy-brightness, 1));
            transition: opacity 0.1s ease, filter 0.1s ease;
        }

        /* แผงควบคุมความโปร่งใสและความสว่าง ดีไซน์กระจก */
        .glass-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
        }

        .panel-header {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #334155;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <!-- องค์ประกอบ div สำหรับแสดงแผนที่ Windy -->
    <div id="windy"></div>

    <!-- แผงควบคุมสไลเดอร์ -->
    <div class="glass-panel">
        <div class="panel-header">
            <span>Windy Live Stream</span>
            <span style="font-size: 9px; background: #0284c7; padding: 2px 6px; border-radius: 8px;">QGIS</span>
        </div>
        
        <div class="control-group">
            <label for="opacitySlider">
                <span>ความทึบ (Opacity):</span> 
                <span id="opacityVal">80%</span>
            </label>
            <input type="range" min="0" max="100" value="80" class="slider" id="opacitySlider">
        </div>

        <div class="control-group">
            <label for="brightnessSlider">
                <span>ความสว่าง (Brightness):</span> 
                <span id="brightnessVal">100%</span>
            </label>
            <input type="range" min="20" max="200" value="100" class="slider" id="brightnessSlider">
        </div>
    </div>
    <script src="script-1.js"></script>	
</body>
</html>
